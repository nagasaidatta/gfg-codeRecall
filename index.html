<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Recall</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="homeScreen" class="home-screen"><section class="home-card"><p class="eyebrow">Flash Code</p><h1>CODE <span>RECALL</span></h1><div class="year-options"><button class="year-button" data-year="third">3rd <small>Years</small></button><button class="year-button" data-year="second">2nd <small>Years</small></button></div><label class="duration-control">Timer duration <select id="durationSelect" aria-label="Timer duration"></select></label></section></main>
<main id="contestScreen" class="contest-screen hidden"><section class="contest-layout"><div class="stage"><div id="stageStatus" class="stage-status">PRESS <kbd>SPACE</kbd> TO REVEAL</div><pre id="codePanel" class="code-panel" aria-live="polite"><code id="codeContent"></code></pre></div><aside class="sidebar"><div class="sidebar-head"><div class="brand">CODE <span>RECALL</span></div><div class="sidebar-actions"><button id="homeButton" class="icon-button" aria-label="Return home">←</button><button id="fullscreenButton" class="fullscreen-button">Fullscreen</button></div></div><section class="timer-section"><p class="sidebar-label">TIMER</p><div id="timer" class="timer">30</div><p id="timerCaption" class="timer-caption">READY</p></section><section class="codes-section"><p class="sidebar-label">CODES</p><nav id="codeList" class="code-list" aria-label="Code navigation"></nav></section><div class="step-controls"><button id="previousButton">Previous Code</button><button id="nextButton">Next Code</button></div></aside></section></main>
<script src="script.js"></script></body></html>
